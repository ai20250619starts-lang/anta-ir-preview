# Inert until the repo exists on GitHub and Harry enables Pages (Settings → Pages → Source: GitHub Actions).
# Manual trigger only, so nothing deploys by accident on first push.
# Set repository secret PREVIEW_PASSWORD to enable the light client-side password gate.
name: Deploy preview to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PREVIEW_SITE: https://${{ github.repository_owner }}.github.io
          PREVIEW_BASE: /${{ github.event.repository.name }}/
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
      - name: Re-run tests against the built site (hidden-terms guard)
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
